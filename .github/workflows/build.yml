name: Build ZMK firmware
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3.0

  draw:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install keymap-drawer
        run: pipx install keymap-drawer

      - name: Draw combined and per-layer SVGs
        run: |
          mkdir -p keymap-drawer
          keymap -c keymap_drawer.config.yaml parse -z config/crosses.keymap > keymap-drawer/crosses.yaml
          keymap -c keymap_drawer.config.yaml draw keymap-drawer/crosses.yaml -j config/info.json > keymap-drawer/crosses.svg
          python3 -c "import yaml" 2>/dev/null || pip install --quiet pyyaml
          python3 <<'PY'
          import glob, re, subprocess, yaml
          layers = list(yaml.safe_load(open('keymap-drawer/crosses.yaml'))['layers'])
          for layer in layers:
              slug = re.sub(r'[^a-z0-9]+', '-', layer.lower()).strip('-')
              with open(f'keymap-drawer/crosses_{slug}.svg', 'w') as out:
                  subprocess.run(['keymap', '-c', 'keymap_drawer.config.yaml', 'draw',
                                  'keymap-drawer/crosses.yaml', '-j', 'config/info.json',
                                  '-s', layer], stdout=out, check=True)
              print('drew', layer)
          # drop fixed dimensions so GitHub renders the SVGs at full column width
          for path in glob.glob('keymap-drawer/*.svg'):
              svg = open(path).read()
              svg = re.sub(r'^<svg width="[0-9.]+" height="[0-9.]+" viewBox', '<svg viewBox', svg)
              open(path, 'w').write(svg)
          PY

      - name: Commit rendered keymaps
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add keymap-drawer
          if ! git diff --cached --quiet; then
            git commit -m "[Draw] keymap render [skip ci]"
            git pull --rebase
            git push
          fi
