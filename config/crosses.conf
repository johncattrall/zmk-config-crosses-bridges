# Uncomment the following line to enable OLED Displays
CONFIG_ZMK_DISPLAY=n

# Deep power-off for travel (soft off behavior); wake by tapping reset
CONFIG_ZMK_PM_SOFT_OFF=y

# Per-half battery levels for the host (e.g. zmk-battery-bar on macOS).
# The central fetches the peripheral's level over the split link and
# proxies it as a second GATT Battery Service. Central-only options;
# reflash the right half to apply. Host reads these over Bluetooth.
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
